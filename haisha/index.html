<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>はいしゃさんに なろう！</title>
<meta name="description" content="こどもが ゆびで ほんものの はいしゃさんの ちりょうを たいけんできる ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* スーパーファミコンの RPG ふう：こんいろの そら・あおい まど・しろい ふち・きんの もじ */
:root{
  --bg:#05081c; --ink:#ffffff; --sub:#b9c3ff; --gold:#ffd75e; --gold-d:#b8860b;
  --win1:#3048b8; --win2:#16247a; --win3:#0a1250; --edge:#f2f2f8; --edge2:#7d8be0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;font-weight:400;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;text-shadow:1px 1px 0 #000}
body{display:flex;justify-content:center;position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% -10%,#24306e 0,#0b1036 45%,#05081c 100%)}
#app{width:100%;max-width:520px;height:100%;height:100dvh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:none;color:inherit}
/* まど */
.btn,.pcard,.card,#bubble,#toolName,.iconbtn{
  background:linear-gradient(180deg,var(--win1) 0%,var(--win2) 55%,var(--win3) 100%);
  border:3px solid var(--edge);border-radius:8px;
  box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--edge2),0 6px 14px rgba(0,0,0,.45);color:#fff}
.btn{font-size:20px;padding:12px 26px 12px 34px;position:relative;letter-spacing:2px}
.btn:before{content:"▶";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--gold);opacity:0}
.btn:hover:before,.btn:active:before,.btn:focus-visible:before,#startBtn:before{opacity:1}
.btn:active{filter:brightness(1.25)}
.btn.gray{font-size:16px;padding:9px 18px 9px 30px}
.btn.sun{color:var(--gold)}
ruby rt{font-size:.5em}

/* タイトル */
#title{align-items:center;justify-content:center;text-align:center;gap:14px}
#title .emblem{position:relative;padding:22px 12px 18px;width:100%}
#title .emblem:before,#title .emblem:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#title .emblem:before{top:0}#title .emblem:after{bottom:0}
#title h1{font-size:40px;line-height:1.25;margin:0;color:var(--gold);letter-spacing:3px;font-weight:400;
  text-shadow:2px 2px 0 #5a3d00,-1px -1px 0 #fff3c0,0 0 18px rgba(255,200,80,.45)}
#title .kicker{font-size:13px;color:var(--sub);letter-spacing:6px;margin:0 0 8px}
#title .sub{font-size:15px;color:#e6e9ff;margin:0;line-height:1.7}
.bigshin{width:auto;height:min(30vh,240px);image-rendering:pixelated;filter:drop-shadow(0 0 12px rgba(120,160,255,.45))}
.foot{font-size:12px;color:#8f9ad6;margin-top:6px}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}

/* かんじゃさん選び */
#select h2{font-size:22px;margin:6px 0 2px;text-align:center;color:var(--gold);letter-spacing:2px;font-weight:400}
#select .lead{font-size:13px;color:var(--sub);text-align:center;margin:0 0 10px}
#plist{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:4px 4px 8px}
.pcard{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;position:relative}
.pcard:active{filter:brightness(1.2)}
.pcard canvas{width:72px;height:72px;flex:none;border-radius:6px;background:#0a0f33;border:2px solid var(--edge2)}
.pcard .nm{font-size:18px}
.pcard .wr{font-size:13px;color:#d6dcff;margin:3px 0}
.pcard .tt{display:inline-block;font-size:12px;color:var(--gold)}
.pcard .rank{display:inline-block;font-size:12px;padding:1px 8px;margin:4px 0 1px;border:1px solid currentColor;border-radius:3px;background:rgba(0,0,0,.35)}
.pcard .rank.r1{color:#8ff0b0}.pcard .rank.r2{color:#ffc35e}.pcard .rank.r3{color:#ff6b7f}.pcard .rank.r4{color:#d38bff;box-shadow:0 0 8px rgba(211,139,255,.6)}
.pcard .st{font-size:16px;color:var(--gold);letter-spacing:1px;margin-left:6px}
.selfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}

/* プレイ */
#play{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
#bubbleRow{display:flex;align-items:flex-end;gap:8px;min-height:96px}
#bubbleRow img{width:auto;height:92px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 6px rgba(120,160,255,.5))}
#bubble{position:relative;flex:1;padding:8px 12px}
#say{font-size:16px;line-height:1.5}
#say b{color:var(--gold);font-weight:400}
#tip{font-size:12px;line-height:1.5;color:#c9d0ff;margin-top:4px}
#tip b{color:#7fe7ff;font-weight:400}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;border-radius:8px;background:#05081c;display:block;
  border:3px solid var(--edge);box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--edge2)}
#barRow{display:flex;align-items:center;gap:8px}
#toolName{font-size:13px;padding:5px 10px;white-space:nowrap;color:var(--gold)}
#bar{flex:1;height:16px;background:#000;border:2px solid var(--edge);border-radius:3px;overflow:hidden;box-shadow:0 0 0 2px #000}
#barIn{height:100%;width:0;background:linear-gradient(180deg,#b6ffb0 0,#36d36a 50%,#169c45 100%)}
.iconbtn{position:absolute;top:10px;width:38px;height:38px;font-size:17px;line-height:30px;text-align:center;z-index:5;padding:0}
#quit{left:10px}#mute{right:10px}
#pad{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 8px 0}
#stick{width:118px;height:118px;border-radius:50%;position:relative;touch-action:none;flex:none;
  background:radial-gradient(circle,#1d2a72 0,#0a1046 70%);border:3px solid var(--edge);box-shadow:0 0 0 2px #000,inset 0 0 0 3px var(--edge2),inset 0 0 18px #000}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff6c8 0,#ffd75e 35%,#b8860b 100%);border:2px solid #3a2a00;box-shadow:0 4px 0 #3a2a00}
#abtn{width:104px;height:104px;border-radius:50%;color:#fff;font-size:21px;letter-spacing:1px;touch-action:none;flex:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 35% 30%,#ff9aa6 0,#d7263d 45%,#7a0f20 100%);border:4px solid var(--gold);box-shadow:0 0 0 2px #000,0 6px 0 #3a0710;text-shadow:2px 2px 0 #000}
#abtn.on{transform:translateY(5px);box-shadow:0 0 0 2px #000,0 1px 0 #3a0710;filter:brightness(1.25)}
#padHelp{flex:1;min-width:0;font-size:12px;color:var(--sub);text-align:center;line-height:1.4;white-space:nowrap}
@media (max-height:720px){#bubbleRow{min-height:0}#bubbleRow img{width:auto;height:56px}#bubble{padding:5px 9px}#say{font-size:14px;line-height:1.35}#tip{font-size:11px;line-height:1.35;margin-top:2px}#play{gap:4px}#toolName{font-size:12px;padding:3px 9px}#stick{width:96px;height:96px}#knob{width:44px;height:44px;margin:-22px 0 0 -22px}#abtn{width:86px;height:86px;font-size:18px}#padHelp{font-size:11px}}
#play #bubbleRow{padding:0 44px 0 40px}

/* けっか */
#result{align-items:center;text-align:center;overflow-y:auto;gap:8px}
#result h2{font-size:26px;margin:6px 0 0;color:var(--gold);letter-spacing:3px;font-weight:400;text-shadow:2px 2px 0 #5a3d00,0 0 14px rgba(255,200,80,.5)}
#rstars{font-size:40px;color:var(--gold);letter-spacing:4px;text-shadow:2px 2px 0 #5a3d00}
#rmsg{font-size:15px;margin:0;line-height:1.6}
#rface{width:104px;height:104px;border:3px solid var(--edge);border-radius:8px;background:#0a0f33;box-shadow:0 0 0 2px #000}
.card{padding:12px 14px;text-align:left;width:100%}
.card h3{margin:0 0 8px;font-size:16px;color:var(--gold);font-weight:400}
.card ul{margin:0;padding-left:1.3em}
.card li{font-size:14px;line-height:1.75;margin-bottom:6px}
.card li::marker{content:"◆ ";color:var(--gold)}
.card li b{font-weight:400;color:#7fe7ff}
.card .order{font-size:12px;line-height:1.7;color:#c9d0ff;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--edge2)}
.card .order b{color:var(--gold);font-weight:400}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px 0 10px}

/* にんていしょう */
#cert{align-items:center;justify-content:center;gap:12px;overflow-y:auto}
.certbox{width:100%;background:linear-gradient(180deg,#2a1d05,#120c02);border:4px double var(--gold);border-radius:6px;padding:20px 16px;text-align:center;box-shadow:0 0 0 2px #000,0 0 24px rgba(255,200,80,.25)}
.certbox h2{font-size:28px;margin:0 0 6px;color:var(--gold);letter-spacing:6px;font-weight:400}
.certbox .nm{font-size:22px;margin:12px 0;border-bottom:2px solid var(--gold-d);display:inline-block;min-width:60%;padding:0 8px;color:#fff}
.certbox p{font-size:15px;line-height:1.8;margin:6px 0;color:#f5e9c8}
.certbox b{color:var(--gold);font-weight:400}
.certbox .dt{font-size:13px;color:#c9b27a}
.certbox .cl{font-size:12px;color:#c9b27a;margin-top:10px}
#certName{font:inherit;font-size:18px;padding:8px 12px;border-radius:6px;border:3px solid var(--edge);background:#0a1250;color:#fff;width:70%;text-align:center;box-shadow:0 0 0 2px #000}
</style>
</head>
<body>
<div id="app">

  <section id="title" class="screen on">
    <img class="bigshin" src="doctor.png" alt="はいしゃさん">
    <div class="emblem">
      <p class="kicker">― DENTAL QUEST ―</p>
      <h1>はいしゃさんに<br>なろう！</h1>
    </div>
    <p class="sub">4にんの かんじゃが まっている<br>ほんものの ちりょうに いどめ！</p>
    <button class="btn" id="startBtn"><span class="blink">はじめる</span></button>
    <p class="foot">おとが でます（マナーモードを きってね）</p>
  </section>

  <section id="select" class="screen">
    <h2>どの こを みてあげる？</h2>
    <p class="lead">かんじゃさんを タップしてね</p>
    <div id="plist"></div>
    <div class="selfoot">
      <button class="btn gray" id="toTitle">もどる</button>
      <button class="btn sun" id="toCert" style="display:none">にんていしょう</button>
    </div>
  </section>

  <section id="play" class="screen">
    <button class="iconbtn" id="quit" aria-label="やめる">✕</button>
    <button class="iconbtn" id="mute" aria-label="おと">♪</button>
    <div id="bubbleRow">
      <img src="doctor.png" alt="">
      <div id="bubble"><div id="say"></div><div id="tip"></div></div>
    </div>
    <div id="stageWrap"><canvas id="cv"></canvas></div>
    <div id="barRow"><div id="toolName"></div><div id="bar"><div id="barIn"></div></div></div>
    <div id="pad">
      <div id="stick" aria-label="スティック"><div id="knob"></div></div>
      <div id="padHelp">← スティックで<br>うごかす<br><br>ボタンで<br>つかう →</div>
      <button id="abtn">つかう</button>
    </div>
  </section>

  <section id="result" class="screen">
    <h2>ちりょう かんりょう！</h2>
    <div id="rstars"></div>
    <canvas id="rface" width="220" height="220"></canvas>
    <p id="rmsg"></p>
    <div class="card" id="rcard"></div>
    <div class="rbtns">
      <button class="btn" id="toSelect">ほかの こを みる</button>
    </div>
  </section>

  <section id="cert" class="screen">
    <div class="certbox">
      <h2>にんていしょう</h2>
      <div class="nm" id="certNm">　</div>
      <p>あなたは <span id="certN">4</span>にんの かんじゃさんを<br>やさしく ちりょう しました。<br>りっぱな <b>はいしゃさん</b> です！</p>
      <p class="dt" id="certDate"></p>
      <p class="cl">大崎オーバルコート歯科・矯正歯科室</p>
    </div>
    <input id="certName" maxlength="12" placeholder="なまえを いれてね">
    <button class="btn gray" id="certBack">もどる</button>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
